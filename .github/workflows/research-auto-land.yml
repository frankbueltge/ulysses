# Safe auto-land of reversible research records (Protocol v4, M-05).
# Replaces the old auto-land.yml, which coupled branch landing to a site dispatch —
# repository integration and public appearance are now separate operations. The site's
# importer runs on its own schedule and remains publication-neutral; a curated Atelier
# work additionally requires a human-approved PUBLICATION.json (never created here).
#
# Mechanism (documented choice per migration patch M-05): direct merge in this workflow,
# serialised by the concurrency group — same proven structure as the old workflow, plus a
# per-branch validation gate. Branch forms:
#   • ulysses/*  — the scheduled research runs (no PR; lands when the gate passes)
#   • claude/*   — a manually started routine/cloud session (opens a PR; lands only while
#                  the PR is OPEN and not a draft — a closed PR is never resurrected)
#
# THE GATE (all must hold, else the branch is REFUSED and left for human review):
#   1. only auto-land-eligible paths changed (allowlist from governance/STANDING-DELEGATION.md §4);
#   2. no protected path touched (PROTOCOL.md, governance/, .github/, tools/, works/, …);
#   3. no PUBLICATION.json created or modified anywhere;
#   4. no changed project is escalated or quarantined (mandate_check/status/disposition);
#   5. main's tools/validate_v4_projects.py passes against the branch tree.
# A refusal is a legitimate outcome (e.g. an escalated project waiting for Frank), not an
# error. HONESTY RULE (kept from the old workflow): an ELIGIBLE branch whose merge or
# push fails turns the job RED. Green means "everything eligible landed" — never
# "failures were logged away". Refusals are fed back to atelier-feedback/ so the next
# session can react.
name: Auto-land research

on:
  push:
    branches: ['ulysses/**', 'claude/**']
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC safety net, ~1h after a scheduled research run
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read   # to check whether a claude/* branch still has an open PR

concurrency:
  group: auto-land
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and merge eligible research branches into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Atelier"
          git config user.email "ulysses@ulysses.invalid"
          git fetch origin '+refs/heads/ulysses/*:refs/remotes/origin/ulysses/*' \
                           '+refs/heads/claude/*:refs/remotes/origin/claude/*' || true

          # Allowlist and protected paths — keep in sync with governance/STANDING-DELEGATION.md §4/§5.
          #
          # Widened 2026-08-02 (Frank): the practice fixes its own instruments and its own
          # automation. What stays human is narrow and named — a credential, an outward
          # channel, the publication surface, the mandate, and the two files that decide what
          # the practice may change. Reason: most of what reached Frank as a "request" this
          # month was not a decision but a blocked repair, and a practice that must ask before
          # fixing its own tooling files a request instead of a fix.
          #
          # `tools/` is theirs EXCEPT the gate's own validator, and `.github/workflows/` is
          # theirs EXCEPT this file. Not an exception for its own sake: a gate that can rewrite
          # its own check is not a gate. It could not weaken the check in the same run that
          # uses it — Gate 4 runs MAIN's validator against the branch tree — but it could land
          # a weakening in one run and use it in the next.
          #
          # Opened 2026-08-12 (Frank): `archive/**` and `REQUESTS-ARCHIVE.md`. Protocol v6
          # ORDERS a line to rotate its older record into `archive/trace/`, and this gate
          # forbade it from writing there — a rule written without checking it could be obeyed.
          # The rotations sat in pull requests nobody merged, so the archived half of the
          # record was on no branch main could see and the site's readers went weaker on a
          # record they could no longer reach. Here, blocking an archive write is what loses
          # record: the writes themselves were pure additions.
          #
          # Frank chose the wide form over an add-only carve-out, knowing the trade: the
          # practice can now also rewrite what it archived, `archive/governance/` and
          # `archive/protocols/` included — the record of what its own rules used to be. Two
          # things stand against that, neither of them a merge queue. §5 still requires a human
          # for "irreversible deletion or migration" on whatever path it happens; and every
          # archive write that is not an addition is REPORTED (Gate 6 below) into the summary
          # and into the feedback file the next session reads at orientation. Delegated, and
          # auditable — a delegation nobody can see the use of is indistinguishable from none.
          ALLOW_RE='^(projects/|journal/|atlas/|pulse/|memory/|encounters/|archive/|docs/research-notes/|tools/|window/|seeds/|presentations/|closing-report/|artifacts/|\.github/workflows/|REQUESTS\.md$|REQUESTS-ARCHIVE\.md$|PROTOCOL\.md$|BULLETIN\.md$)'
          PROTECT_RE='^(README\.md|LICENSE\.md|SITE-API\.md|governance/|works/|site-prs/|tools/validate_v4_projects\.py$|\.github/workflows/research-auto-land\.yml$)|(^|/)PUBLICATION\.json$'
          # A step that reaches for a repository secret is the one thing a session must not
          # grant itself: the whole reason Actions is privileged is that the credentials live
          # there. Code that READS a credential out of its environment is fine and expected
          # (that is how the runners work) — what needs a human is a workflow handing one over.
          SECRET_GRANT_RE='\$\{\{[^}]*secrets\.'

          landed=0
          failed=0
          summary=""
          refusals=""
          # A FAILURE is not a refusal, and the feedback file says so in its own words ("a
          # refusal is not an error"). Appending conflicts to `refusals` would tell the practice
          # it had been refused when the machinery simply broke — so failures get their own list
          # and their own heading in the same file. Added 2026-08-10 (architect) on Ulysses'
          # report: a whole session of 2026-08-08 never reached main and nothing told it, because
          # the two outcomes that turn this job red were the two it never wrote down.
          failures=""
          # A REPORT is neither: the branch landed and nothing objected. It exists because
          # `archive/**` was delegated whole on 2026-08-12 and a delegation whose use leaves no
          # trace cannot be reviewed later. Only writes that could remove record are reported,
          # never ordinary rotation — a report on every addition would be noise, and noise is
          # how a report stops being read.
          reports=""
          note() {
            echo "outcome $1 $2"
            summary="${summary}| \`$1\` | $2 |"$'\n'
          }
          refuse() {
            note "$1" "$2"
            refusals="${refusals}- \`$1\` — $2: $3"$'\n'
          }
          fail() {
            note "$1" "$2"
            failures="${failures}- \`$1\` — $2: $3"$'\n'
          }
          report() {
            reports="${reports}- \`$1\` — $2"$'\n'
          }

          for b in $(git branch -r | sed 's/^[* ] *//' | grep -E '^origin/(ulysses|claude)/' || true); do
            name="${b#origin/}"
            echo "::group::considering $name"

            # claude/* lands only while its PR is OPEN and not a draft (a closed PR means
            # a human declined the session; it must never resurrect on main).
            case "$name" in
              claude/*)
                pr_state=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$name" --state open \
                  --json isDraft --jq 'if length == 0 then "none" elif .[0].isDraft then "draft" else "open" end' 2>/dev/null || echo none)
                if [ "$pr_state" = "none" ]; then
                  note "$name" skipped_no_pr; echo "::endgroup::"; continue
                elif [ "$pr_state" = "draft" ]; then
                  note "$name" skipped_draft_pr; echo "::endgroup::"; continue
                fi ;;
            esac

            changed="$(git diff --name-only "origin/main...$b")"
            if [ -z "$changed" ]; then
              note "$name" skipped_empty; echo "::endgroup::"; continue
            fi
            printf '%s\n' "$changed"

            # Gate 2+3: protected paths and publication metadata never auto-land.
            bad="$(printf '%s\n' "$changed" | grep -E "$PROTECT_RE" | head -3 || true)"
            if [ -n "$bad" ]; then
              refuse "$name" refused_protected_path "$(echo "$bad" | tr '\n' ' ')"
              echo "::endgroup::"; continue
            fi
            # Gate 1: everything else must be inside the allowlist.
            bad="$(printf '%s\n' "$changed" | grep -Ev "$ALLOW_RE" | head -3 || true)"
            if [ -n "$bad" ]; then
              refuse "$name" refused_path_outside_allowlist "$(echo "$bad" | tr '\n' ' ')"
              echo "::endgroup::"; continue
            fi

            # Gate 1b: workflows are the practice's, but granting itself a credential is not.
            # Only ADDED lines are read: a branch that merely moves or reindents an existing
            # `secrets.` line is not asking for anything new, and refusing it would make every
            # ordinary edit to a credentialed workflow a human errand.
            granted="$(git diff "origin/main...$b" -- '.github/workflows/' \
                        | grep -E "^\+" | grep -E "$SECRET_GRANT_RE" | head -3 || true)"
            if [ -n "$granted" ]; then
              refuse "$name" refused_secret_grant "$(echo "$granted" | tr '\n' ' ' | cut -c1-200)"
              echo "::endgroup::"; continue
            fi

            # Gate 6 — the one that does not refuse. `archive/**` is the practice's own since
            # 2026-08-12, so rotation lands unattended; but a write there that DELETES, MODIFIES
            # or RENAMES is the one shape that can make record disappear, and §5's human hand on
            # "irreversible deletion or migration" survives the path change. Naming it here is
            # what makes that clause checkable after the fact instead of merely written down.
            # Read BEFORE the merge, reported only if the branch actually lands: `origin/main`
            # moves under our feet on the push, and a refused branch has nothing to report.
            rewritten="$(git diff --name-status --diff-filter=DMR "origin/main...$b" -- 'archive/' \
                          | head -5 | tr '\n' ' ' || true)"

            # Gate 4+5: validate the branch TREE with MAIN's validator (tools/ is a
            # protected path, so the validator cannot be altered by the branch itself).
            worktree="$(mktemp -d)/wt"
            git worktree add --detach "$worktree" "$b" >/dev/null
            gate_ok=1
            if ! python tools/validate_v4_projects.py "$worktree"; then
              refuse "$name" refused_validation "see validator output above"
              gate_ok=0
            else
              # No changed project may be escalated or quarantined.
              project_dirs="$(printf '%s\n' "$changed" | awk -F/ '$1 == "projects" && $2 !~ /^_/ {print $1 "/" $2}' | sort -u)"
              while IFS= read -r project_dir; do
                [ -z "$project_dir" ] && continue
                score="$worktree/$project_dir/SCORE.md"
                if [ ! -f "$score" ]; then
                  refuse "$name" refused_validation "$project_dir has no SCORE.md"
                  gate_ok=0; break
                fi
                if grep -Eq '^mandate_check:[[:space:]]*ESCALATE|^status:[[:space:]]*QUARANTINED|^disposition:[[:space:]]*ESCALATE' "$score"; then
                  refuse "$name" refused_escalation "$project_dir is escalated/quarantined and waits for human review"
                  gate_ok=0; break
                fi
              done <<< "$project_dirs"
            fi
            git worktree remove --force "$worktree"
            if [ "$gate_ok" = "0" ]; then echo "::endgroup::"; continue; fi

            # Eligible: merge, push, delete the branch. Failures here are RED.
            if git merge --no-edit "$b"; then
              if git push origin main && git push origin --delete "$name"; then
                landed=$((landed+1)); note "$name" landed
                # An `if`, not `[ … ] && …`: under `set -e` the short form is a statement whose
                # false case ends the job, and the false case here is every ordinary landing.
                if [ -n "$rewritten" ]; then
                  report "$name" "landed, and archive/ was not only added to: $rewritten"
                fi
              else
                failed=$((failed+1)); fail "$name" push_failed "the merge succeeded locally but main could not be pushed; the branch is untouched and will be retried on the next run"
                git reset --hard origin/main   # never build later merges on an unpushed state
              fi
            else
              failed=$((failed+1)); fail "$name" conflict "this branch does not merge into main; it will be retried on every run and keep failing until the overlap is resolved by hand"
              git merge --abort || true
            fi
            echo "::endgroup::"
          done

          # Feed refusals back to the practice (non-fatal): the next session reads
          # atelier-feedback/ during orientation. Refused branches stay untouched.
          if [ -n "$refusals$failures$reports" ]; then
            DATE=$(date -u +%F)
            git checkout main >/dev/null 2>&1 || true
            git reset --hard origin/main
            mkdir -p atelier-feedback
            {
              printf '# Auto-land: what did not land, %s\n\n' "$DATE"
              if [ -n "$refusals" ]; then
                printf '## Refused\n\n'
                printf 'These branches were NOT landed. A refusal is not an error: protected paths\n'
                printf 'and escalated projects require a human-reviewed pull request (see\n'
                printf 'governance/STANDING-DELEGATION.md §4/§5). Ordinary research records belong\n'
                printf 'under the auto-land-eligible paths.\n\n%s\n' "$refusals"
              fi
              if [ -n "$failures" ]; then
                printf '## Failed — the machinery, not the gate\n\n'
                printf 'These branches were eligible and the gate did not object. They did not land\n'
                printf 'because the merge or the push broke, which turns this job red. Nothing about\n'
                printf 'them was judged; the record is still on the branch and still recoverable.\n\n%s\n' "$failures"
              fi
              if [ -n "$reports" ]; then
                printf '## Noted — landed, and worth seeing\n\n'
                printf 'Neither a refusal nor a failure: these branches landed and the gate did not\n'
                printf 'object. `archive/**` became yours on 2026-08-12, and rotation into it needs no\n'
                printf 'human — but a write there that deletes, modifies or renames is the one shape\n'
                printf 'that can make record disappear, and §5 still asks a human about irreversible\n'
                printf 'deletion whatever path it happens on. Nothing is being asked of you here. If a\n'
                printf 'line below is a surprise, that is the point of writing it down.\n\n%s\n' "$reports"
              fi
            } > "atelier-feedback/${DATE}-autoland-refusals.md"
            git add atelier-feedback && git commit -m "feedback: auto-land refusals ${DATE}" \
              && git push origin main || echo "::warning::refusal feedback not pushed (non-fatal)"
          fi

          printf '## Auto-land (Protocol v4)\n\n| branch | outcome |\n|---|---|\n%s\n**%s landed, %s failed**\n' \
            "$summary" "$landed" "$failed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed eligible branch(es) failed to land — see outcome lines above"
            exit 1
          fi
