# Cycle releases (2026-10-25, the amendment "the lines" in PROTOCOL.md, point 7).
# Every cycle presentation that stands under presentations/cycle-NNN/ is published as a GitHub
# release tagged cycle-NNN, pointing at the last commit that touched its SUMMARY.md. The
# repository is connected to Zenodo, which archives each release and gives it a DOI; the
# citation metadata comes from CITATION.cff. A release that exists is never touched again.
name: cycle-release

on:
  push:
    branches: [main]
    paths:
      - 'presentations/cycle-*/SUMMARY.md'
      - '.github/workflows/cycle-release.yml'
  # Presentations often land through auto-land under the Actions token, whose pushes start no
  # workflow; the daily run catches them.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cycle-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish a release for every presented cycle that has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for dir in presentations/cycle-[0-9][0-9][0-9]; do
            [ -f "$dir/SUMMARY.md" ] || continue
            tag=$(basename "$dir")
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: release stands"
              continue
            fi
            sha=$(git log -1 --format=%H -- "$dir/SUMMARY.md")
            title=$(grep -m1 '^# ' "$dir/SUMMARY.md" | sed 's/^# *//' || true)
            [ -n "$title" ] || title="$tag"
            {
              echo "The presentation of ${tag/cycle-/cycle } in this practice of the research ecology at frankbueltge.de."
              echo
              echo "Summary: https://github.com/${GITHUB_REPOSITORY}/blob/${sha}/${dir}/SUMMARY.md"
              echo
              echo "Code under Apache 2.0, works and texts under CC BY 4.0 (LICENSE.md)."
            } > /tmp/notes.md
            gh release create "$tag" --target "$sha" --title "${tag/cycle-/Cycle }: ${title}" --notes-file /tmp/notes.md
            echo "$tag: released at $sha"
          done
