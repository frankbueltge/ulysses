# Structural validation of Protocol v4 project records on pull requests.
# This workflow validates only; publication and mandate amendments remain human decisions.
name: Validate Ulysses project records

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/**'
      - 'works/**'
      - 'governance/**'
      - 'PROTOCOL.md'
      - 'README.md'
      # Was 'tools/validate_v4_projects.py' alone until 2026-08-13 — the whole directory now,
      # because the tests below live here too and a test that cannot trigger its own workflow
      # is a test nobody runs.
      - 'tools/**'
      - 'docs/foundation/**'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ulysses-project-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Protocol v4 project records
        run: python tools/validate_v4_projects.py
      # Added 2026-08-13. Until today this repository ran pytest NOWHERE: test_constitution_refs.py
      # was written on 2026-08-12 to make dead protocol pointers loud, and had never once run in
      # CI — a guard against silent failure, failing silently. Found while wiring §8's prior-art
      # floor, whose own tests would have joined it in never running.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest
      - name: Run the repository's tests
        run: python -m pytest tools/ -q
      - name: State governance boundary
        run: |
          echo 'Structural validation passed.'
          echo 'This workflow validates only; publication and mandate amendments remain human decisions.'
